[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docktalk"
version = "0.1.0"
description = "Voice assistant for Bike Share Toronto riders"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.32",
    "google-genai>=0.8",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
    "audio-recorder-streamlit>=0.0.10",
    "openai>=1.0",
    "geopy>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-mock>=3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["docktalk*", "src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
